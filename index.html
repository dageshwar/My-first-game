<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevents text selection on mobile */
            -webkit-user-select: none;
            touch-action: manipulation; /* Prevents zoom on fast tapping */
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-
direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100vw;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        canvas {
            background-color: #000000;
            border: 3px solid #333;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            max-height: 50vh;
        }

        /* On-screen Touch Controls */
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px #1a1a1a;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
        }

        .btn:active {
            background-color: #555;
            transform: translateY(4px);
            box-shadow: 0 0 #1a1a1a;
        }

        /* Grid Button Positions */
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .game-over-overlay h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .restart-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div>Score: <span id="score">0</span></div>
            <div>High: <span id="high-score">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Touch Screen Arrows -->
        <div class="controls">
            <button class="btn" id="btn-up">▲</button>
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-right">▶</button>
            <button class="btn" id="btn-down">▼</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="game-over-overlay hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button class="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const finalScoreEl = document.getElementById("final-score");
        const gameOverScreen = document.getElementById("game-over-screen");

        // Grid Settings
        const gridSize = 20; // 20x20 pixels per tile
        const tileCount = canvas.width / gridSize;

        // Game Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize; // Initial velocity (moving right)
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameLoop;
        let isChangingDirection = false; // Prevents fast double-tap self-collision

        highScoreEl.innerText = highScore;

        function startGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            score = 0;
            dx = gridSize;
            dy = 0;
            scoreEl.innerText = score;
            gameOverScreen.classList.add("hidden");
            spawnFood();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, 100); // Game speed (100ms)
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Ensure food doesn't spawn on top of snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function draw() {
            moveSnake();

            if (checkGameOver()) {
                handleGameOver();
                return;
            }

            isChangingDirection = false;

            // Clear Screen
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.fillStyle = "#ff4757";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff4757";
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);

            // Draw Snake
            ctx.shadowBlur = 0; // Turn off glow for body performance
            snake.forEach((part, index) => {
                // Head is brighter green
                ctx.fillStyle = index === 0 ? "#2ed573" : "#26af5f";
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if snake ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function checkGameOver() {
            const head = snake[0];

            // Wall collisions
            const hitLeft = head.x < 0;
            const hitRight = head.x >= canvas.width;
            const hitTop = head.y < 0;
            const hitBottom = head.y >= canvas.height;

            if (hitLeft || hitRight || hitTop || hitBottom) return true;

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }

            return false;
        }

        function handleGameOver() {
            clearInterval(gameLoop);
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove("hidden");
        }

        function changeDirection(direction) {
            if (isChangingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (direction === 'LEFT' && !goingRight) {
                dx = -gridSize; dy = 0;
                isChangingDirection = true;
            }
            if (direction === 'UP' && !goingDown) {
                dx = 0; dy = -gridSize;
                isChangingDirection = true;
            }
            if (direction === 'RIGHT' && !goingLeft) {
                dx = gridSize; dy = 0;
                isChangingDirection = true;
            }
            if (direction === 'DOWN' && !goingUp) {
                dx = 0; dy = gridSize;
                isChangingDirection = true;
            }
        }

        function resetGame() {
            startGame();
        }

        // Keyboard Controls
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") changeDirection('LEFT');
            if (e.key === "ArrowUp" || e.key === "w") changeDirection('UP');
            if (e.key === "ArrowRight" || e.key === "d") changeDirection('RIGHT');
            if (e.key === "ArrowDown" || e.key === "s") changeDirection('DOWN');
        });

        // Touch Control Listeners (Supports touchstart for rapid responsiveness)
        const bindTouch = (id, direction) => {
            const btn = document.getElementById(id);
            const handlePress = (e) => {
                e.preventDefault(); // Prevents touch lag/emulated click
                changeDirection(direction);
            };
            btn.addEventListener("touchstart", handlePress, { passive: false });
            btn.addEventListener("mousedown", handlePress);
        };

        bindTouch("btn-up", 'UP');
        bindTouch("btn-left", 'LEFT');
        bindTouch("btn-right", 'RIGHT');
        bindTouch("btn-down", 'DOWN');

        // Start game on load
        startGame();
    </script>
</body>
     </html>
